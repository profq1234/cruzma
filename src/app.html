<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="utf-8" />
<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

<!-- Preconnect for Google Fonts to maximize Core Web Vitals -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover" class="bg-alabaster text-charcoal font-sans antialiased selection:bg-charcoal selection:text-white">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
